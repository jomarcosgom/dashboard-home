<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e31"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8f00"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f50057"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Ambient Glow circle in center -->
  <circle cx="256" cy="260" r="140" fill="#ff6b35" opacity="0.15" filter="url(#glow)"/>

  <!-- House roof structure -->
  <path d="M120 250 L256 130 L392 250" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M120 250 L256 130 L392 250" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- House body -->
  <path d="M165 240 L165 370 Q165 390 185 390 L327 390 Q347 390 347 370 L347 240" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Smart IoT Signal / WiFi waves inside -->
  <path d="M216 295 A 56 56 0 0 1 296 295" fill="none" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M192 265 A 90 90 0 0 1 320 265" fill="none" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" opacity="0.7"/>

  <!-- Center smart node dot -->
  <circle cx="256" cy="335" r="14" fill="url(#accentGrad)"/>
</svg>
